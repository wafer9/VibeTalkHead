# LIA-X-style 256p motion autoencoder with a 64-D exported motion token.
#
# The source and target share one encoder.  Its absolute motion coefficient is
# mapped through a learned orthogonal dictionary into renderer style space.
# LLM/DiT export still stores A_t - A_0, so frame zero is exactly zero and no
# autoregressive integration is required.  The renderer warps and feature-mask
# fuses motion-generated and warped source features, then produces RGB only
# through learned ToRGB skips; there is no raw warped-reference RGB shortcut.
seed: 2026
output_dir: exp/motion_tokenizer_256_liax_fused
resume: null

data:
  train_manifest: /nfs-speech-cfs/wangzhou/s2s/vibehead_wan/data/talker_vivid/train.json
  val_manifest: /nfs-speech-cfs/wangzhou/s2s/vibehead_wan/data/talker_vivid/dev.json
  video_root: /nfs-speech-cfs/wangzhou/s2s/vibehead/data/talker/shards
  target_fps: 25
  image_size: 256
  clip_length: 4
  batch_size: 8
  val_batch_size: 1
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  max_retries: 12
  max_train_samples: 0
  max_val_samples: 0
  first_frame_reference_prob: 0.5
  photometric_strength: 0.08
  horizontal_flip_prob: 0.5

model:
  motion_dim: 64
  # 200.88M generator parameters after removing warp-post-concat convolutions.
  base_channels: 80
  motion_blocks_per_stage: 1
  reference_blocks_per_stage: 0
  renderer_blocks_per_stage: 4
  full_resolution_stage: true
  full_resolution_channels: 80
  gradient_checkpointing: true
  motion_input_size: 256

  # LIA-X-compatible representation/application path.
  shared_motion_encoder: true
  liax_coefficient_mode: true
  renderer_style_dim: 512
  orthogonal_motion_dictionary: true
  rgb_blocks_per_stage: 4

  # Present for API compatibility; all staged temporal processing is disabled.
  causal_kernel_size: 5
  causal_layers: 3

training:
  # Per-rank batch=8 on 16 GPUs gives a global batch of 128 clips/update.
  max_steps: 50000
  warmup_steps: 1000
  min_lr_ratio: 0.10
  lr: 0.0001
  motion_lr_multiplier: 1.0
  discriminator_lr: 0.0001
  discriminator_weight_decay: 0.0
  betas: [0.9, 0.95]
  discriminator_betas: [0.0, 0.99]
  weight_decay: 0.01
  accumulation_steps: 1
  grad_clip: 1.0
  discriminator_grad_clip: 5.0
  dtype: bf16
  render_chunk: 1
  freeze_motion_encoder: false
  # This baseline does not define the final LLM/DiT distribution. Keep the
  # shared encoder and motion head end-to-end trainable for all 50k steps.
  freeze_motion_after_normalizer: false
  find_unused_parameters: false
  log_interval: 20
  preview_interval: 500
  eval_interval: 1000
  validation_batches: 8
  save_interval: 5000

stages:
  # 0-5k: L1 + VGG reconstruction warm start.
  # 5k-50k: add image GAN and keep the full generator end-to-end trainable.
  # Motion normalization/export is intentionally disabled. A later KL or
  # Gaussian-friendly training phase will define the final token distribution.
  image_gan_start: 5000

loss:
  # LIA-X objective: reconstruction + VGG + image GAN + sparse coefficients.
  reconstruction: 1.0
  perceptual: 0.10
  image_adversarial: 0.10
  motion_sparsity: 0.001

  # More image coverage than the 512 run is affordable at 256p.
  max_perceptual_frames: 8
  max_gan_frames: 8
  vgg_weights_path: checkpoints/motion_tokenizer/vgg16-397923af.pth

image_discriminator:
  scales: 3
  base_channels: 64
  max_channels: 512
  num_layers: 5
