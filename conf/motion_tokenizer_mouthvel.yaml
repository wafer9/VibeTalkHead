# Controlled 40k -> 45k renderer fine-tune with frozen motion encoder.
seed: 2026
output_dir: exp/motion_tokenizer_256_mouthvel_normfix_from40k_no
resume: exp/motion_tokenizer_256_cyclefix/step_000040000.pt

data:
  train_manifest: /nfs-speech-cfs/wangzhou/s2s/vibehead_wan/data/talker_vivid/train.json
  val_manifest: /nfs-speech-cfs/wangzhou/s2s/vibehead_wan/data/talker_vivid/dev.json
  video_root: /nfs-speech-cfs/wangzhou/s2s/vibehead/data/talker/shards
  target_fps: 25
  image_size: 256
  clip_length: 16
  batch_size: 8
  val_batch_size: 1
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  max_retries: 12
  max_train_samples: 0
  max_val_samples: 0
  first_frame_reference_prob: 0.5
  photometric_strength: 0.12
  horizontal_flip_prob: 0.5

model:
  motion_dim: 64
  base_channels: 32
  reference_blocks_per_stage: 1
  motion_input_size: 256
  causal_kernel_size: 5
  causal_layers: 3

training:
  # Checkpoint step is 40k; max_steps is absolute, hence this runs 5k updates.
  max_steps: 45000
  warmup_steps: 1000
  min_lr_ratio: 0.05
  lr: 0.0002
  motion_lr_multiplier: 1.0
  discriminator_lr: 0.0002
  betas: [0.9, 0.95]
  discriminator_betas: [0.0, 0.99]
  weight_decay: 0.01
  accumulation_steps: 2
  grad_clip: 1.0
  discriminator_grad_clip: 5.0
  dtype: bf16
  render_chunk: 4
  freeze_motion_after_normalizer: true
  # Explicitly removes encoder autograd/optimizer work in this branch.
  freeze_motion_encoder: true
  log_interval: 20
  preview_interval: 500
  eval_interval: 1000
  validation_batches: 8
  save_interval: 1000

stages:
  # Keep all 40k production conditions unchanged for a controlled ablation.
  cross_identity_start: 10000
  image_gan_start: 15000
  video_gan_start: 20000
  normalizer_freeze_step: 25000
  causal_start: 25000
  causal_ramp_steps: 5000
  noise_start: 30000
  noise_ramp_steps: 5000
  max_noise_sigma: 0.10
  noise_mode: mixed

loss:
  reconstruction: 1.0
  laplacian: 1.0
  gradient: 0.20
  region: 0.50
  temporal_velocity: 0.50
  temporal_acceleration: 0.20
  # New clean-reconstruction geometry losses. Only one adjacent pair/clip is
  # evaluated per update; the target FAN branch is detached.
  # Smoke values are ~0.012/0.013, so these contribute ~4.5% of total loss.
  mouth_landmark_velocity: 1.00
  mouth_openness_velocity: 0.50
  mouth_velocity_beta: 0.01
  fan_softargmax_temperature: 20.0
  fan_confidence_threshold: 0.20
  fan_gradient_checkpoint: true
  # Per generated frame; clips only the auxiliary FAN path, not other losses.
  fan_input_grad_max_norm: 0.02
  face_alignment_path: checkpoints/motion_tokenizer/probe_deps
  fan_weights_path: checkpoints/motion_tokenizer/probe_weights/hub/checkpoints/2DFAN4-11f355bf06.pth.tar
  flow_tv: 0.01
  covariance: 0.001
  motion_moment: 0.01
  motion_target_std: 0.20
  perceptual: 0.10
  max_perceptual_frames: 4
  vgg_weights_path: checkpoints/motion_tokenizer/vgg16-397923af.pth
  identity: 0.10
  identity_model_path: checkpoints/motion_tokenizer/arcface_w600k_r50.ts
  noisy_reconstruction: 1.0
  noise_consistency: 0.20
  noisy_temporal: 0.50
  cross_motion_cycle: 0.20
  cross_appearance: 0.05
  cross_identity: 0.10
  image_adversarial: 0.05
  feature_matching: 0.50
  video_adversarial: 0.05
  laplacian_levels: 4
  max_gan_frames: 8
  video_gan_size: 128

image_discriminator:
  scales: 2
  base_channels: 64

video_discriminator:
  base_channels: 32
  max_channels: 256
